# Zephyr 4.3.0 / nucleo_g474re — 検証用オンボードテスト
CONFIG_GPIO=y
CONFIG_DYNAMIC_INTERRUPTS=y
CONFIG_PWM=y
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_LSM6DSO=y

CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
# printk が LOG 経由でシェルのログバックエンドに流れ、メッセージ毎に
# 「行消去＋プロンプト再描画」が挟まるのを防ぐ（printk は UART コンソールへ直接出力）。
CONFIG_LOG_PRINTK=n
# printk(uart_poll_out)とシェル割込TXの競合を避けるためシェルTXもpoll_outに統一
# （RXは割込駆動のまま）。
CONFIG_SHELL_BACKEND_SERIAL_FORCE_TX_BLOCKING_MODE=y

# 制限付きC++（例外・RTTI・動的確保なし）
CONFIG_CPP=y
CONFIG_STD_CPP23=y
CONFIG_STATIC_INIT_GNU=n

# FPU 利用（制御スレッドで浮動小数点を使用）
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# ヒープは使用しない
CONFIG_HEAP_MEM_POOL_SIZE=0

CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# ログ
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MODE_IMMEDIATE=y
