description: Ball-balancing robot board GPIO/PWM assignments
compatible: "bb,pins"

include: base.yaml

properties:
  led-gpios:
    type: phandle-array
    required: true
    description: Status LED output pin
  estop-gpios:
    type: phandle-array
    required: true
    description: External emergency stop input (active low)
  estop-btn-gpios:
    type: phandle-array
    required: true
    description: Board button emergency stop input (active low)
  pwms:
    type: phandle-array
    required: true
    description: Motor PWM outputs, MxA/MxB pairs per motor (M0A, M0B, M1A, M1B, M2A, M2B)
