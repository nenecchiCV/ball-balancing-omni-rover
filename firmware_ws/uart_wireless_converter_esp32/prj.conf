# Zephyr 4.3.0 / xiao_esp32c6/esp32c6/hpcore
CONFIG_GPIO=y
CONFIG_DYNAMIC_INTERRUPTS=y

# host 側 UART（uart0、G474 への物理リンク）
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# USB-Serial-JTAG 上の console/shell（usb_serial、espressif,esp32-usb-serial）
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_UART_CONSOLE=y

# BLE ペリフェラル（UWC_TRANSPORT_BLE 時）
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="uwc-esp32c6"
CONFIG_BT_DEVICE_APPEARANCE=0
CONFIG_BT_MAX_CONN=1
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_DATA_LEN_UPDATE=y
CONFIG_BT_USER_DATA_LEN_UPDATE=y

# ATT MTU 拡大（NFR-01: MTU 247 目標）。BT_SMP 無効時の既定値では
# L2CAP TX MTU=23・ACL RX=27B（RX MTU=23）となり Exchange MTU が
# 実効しないため、L2CAP/ACL バッファを 247 B ATT PDU に合わせて拡大する。
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251

# 制限付きC++（例外・RTTI・動的確保なし）
CONFIG_CPP=y
CONFIG_STD_CPP23=y
CONFIG_STATIC_INIT_GNU=n

# カーネルヒープは ESP 無線スタック内部確保のため有効化する。
# アプリケーション側コードは動的確保を使わない（NFR-04）。
CONFIG_HEAP_MEM_POOL_SIZE=54096

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# ログ
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MODE_IMMEDIATE=y
